<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101214">
<title>Megastructure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101214; overflow: hidden; overscroll-behavior: none; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #d8dde2; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .mg { position: fixed; inset: 0; touch-action: none; }
  .mg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mg .mg-dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(230,235,240,0.7); pointer-events: none; display: none; }
  .mg.looking .mg-dot, .mg.touch .mg-dot { display: block; }
  .mg .mg-top { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  .mg .mg-where { display: grid; gap: 1px; padding: 7px 12px; border-radius: 10px; background: rgba(18,20,23,0.78); font-size: 0.95rem; }
  .mg .mg-where span, .mg .mg-pos { font-size: 0.74rem; opacity: 0.72; }
  .mg .mg-pos { position: absolute; left: 0; top: 58px; padding: 0 4px; text-shadow: 0 0 4px rgba(10,12,14,0.8); }
  .mg .mg-btns { margin-left: auto; display: flex; gap: 8px; pointer-events: auto; }
  .mg .mg-pages { padding: 8px 12px; border-radius: 10px; background: rgba(18,20,23,0.78); color: inherit; font-size: 0.85rem; text-decoration: none; }
  .mg .mg-biomes { position: absolute; z-index: 3; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 0 12px; pointer-events: none; }
  .mg .mg-biomes button { pointer-events: auto; appearance: none; border: 1px solid rgba(220,226,232,0.18); padding: 5px 10px; border-radius: 999px; background: rgba(18,20,23,0.7); color: inherit; font: inherit; font-size: 0.78rem; cursor: pointer; }
  .mg .mg-biomes button.on { background: #d8dde2; color: #101214; }
  .mg .mg-btns button { appearance: none; border: 0; padding: 8px 12px; border-radius: 10px; background: rgba(18,20,23,0.78); color: inherit; font: inherit; font-size: 0.85rem; cursor: pointer; }
  .mg .mg-toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); max-width: 80%; padding: 8px 14px; border-radius: 10px; background: rgba(18,20,23,0.9); color: #e6eaee; font-size: 0.9rem; text-align: center; pointer-events: none; }
  .mg .mg-load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 10px; background: rgba(18,20,23,0.85); font-size: 0.95rem; }
  .mg .mg-help { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); display: grid; gap: 4px; text-align: center; padding: 14px 22px; border-radius: 12px; background: rgba(18,20,23,0.88); cursor: pointer; }
  .mg .mg-help b { font-size: 1.05rem; } .mg .mg-help span { font-size: 0.82rem; opacity: 0.75; }
  .mg.looking .mg-help, .mg.touch .mg-help { display: none; }
  .mg .mg-touch { position: absolute; inset: 0; display: none; }
  .mg.touch .mg-touch { display: block; }
  .mg .mg-stick { position: absolute; width: 0; height: 0; pointer-events: none; }
  .mg .mg-stick::before { content: ''; position: absolute; left: -52px; top: -52px; width: 104px; height: 104px; border-radius: 50%; border: 2px solid rgba(10,12,14,0.8); background: rgba(30,36,40,0.18); }
  .mg .mg-stick i { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-radius: 50%; background: rgba(18,20,23,0.85); transform: translate(-50%, -50%); }
  .mg .mg-jump { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 28px); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(18,20,23,0.85); background: rgba(30,36,40,0.28); color: #f0f3f5; font-size: 0.85rem; letter-spacing: 0.06em; appearance: none; touch-action: none; }
  .mg .mg-guide { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 122px); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(18,20,23,0.85); background: rgba(30,36,40,0.28); color: #ffe2a8; font-size: 0.72rem; letter-spacing: 0.06em; appearance: none; touch-action: none; }
  .mg .mg-stats { position: absolute; left: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); font: 0.62rem ui-monospace, SFMono-Regular, Menlo, monospace; opacity: 0.45; pointer-events: none; text-shadow: 0 0 3px rgba(10,12,14,0.9); white-space: nowrap; }
  .mg.touch .mg-stats { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 78px); }
  .mg .mg-jump:active { background: rgba(240,243,245,0.55); color: #d8dde2; }
  .mg .mg-hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 6px 12px; border-radius: 10px; background: rgba(12,14,16,0.55); font-size: 0.72rem; pointer-events: none; white-space: nowrap; }
  .mg .mg-hint span { display: inline-flex; gap: 5px; align-items: center; opacity: 0.85; }
  .mg .mg-hint kbd { display: inline-block; min-width: 18px; padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(220,226,232,0.35); border-bottom-width: 2px; background: rgba(220,226,232,0.08); font: 600 0.68rem ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; color: #e6eaee; }
  .mg .mg-surf { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 122px); bottom: calc(env(safe-area-inset-bottom, 0px) + 108px); width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(18,20,23,0.85); background: rgba(30,36,40,0.28); color: #cfe6ff; font-size: 1.1rem; appearance: none; touch-action: none; }
  .mg.touch .mg-hint { display: none; }
</style>
</head>
<body>
<div class="mg mg-stage">
  <canvas aria-label="First-person view of an endless structure"></canvas>
  <i class="mg-dot"></i>
  <div class="mg-top"><div class="mg-where"></div><div class="mg-btns"><button class="mg-seed" type="button" title="A new structure">New</button><button class="mg-respawn" type="button" title="Back to the start (R)">Start</button><button class="mg-full" type="button" title="Full screen">⛶</button><a class="mg-pages" href="delve.html" title="The 2D maze, camp and tools">Delve</a></div></div>
  <div class="mg-pos"></div>
  <div class="mg-load">Building the first rooms…</div>
  <div class="mg-toast" hidden></div>
  <div class="mg-help"><b>Click to look around</b><span>W A S D walk · mouse looks · Space jumps · Shift runs · F shows the way out · T to the surface and back · R back to the start · Esc frees the mouse</span></div>
  <div class="mg-hint"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span><kbd>Mouse</kbd> look</span><span><kbd>Space</kbd> jump</span><span><kbd>Shift</kbd> sprint</span><span><kbd>F</kbd> way out</span><span><kbd>T</kbd> surface ⇅</span><span><kbd>R</kbd> start</span><span><kbd>Esc</kbd> free mouse</span></div>
  <div class="mg-stats"></div>
  <div class="mg-biomes" aria-label="Force one kind of district"></div>
  <div class="mg-touch"><div class="mg-stick" hidden><i></i></div><button class="mg-jump" type="button">JUMP</button><button class="mg-guide" type="button" title="The way to a portal">WAY</button><button class="mg-surf" type="button" title="To the surface and back">⇅</button></div>
</div>
<script src="mega/world.js"></script>
<script src="mega/body.js"></script>
<script src="mega/guide.js"></script>
<script src="mega/game.js"></script>
<script>MegaGame.init(document.querySelector('.mg'));</script>
<script src="assets/build.js"></script>
<script src="assets/sw-register.js"></script>
</body>
</html>
